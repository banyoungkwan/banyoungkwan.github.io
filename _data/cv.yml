- title: 기본 정보
  type: map
  contents:
    - name: 성명
      value: 반영관
    - name: 생년월일
      value: 1982년 7월 23일
    - name: 언어
      value: 한국어, 영어

- title: 학력
  type: time_table
  contents:
    - title: 미디어와 커뮤니케이션 박사
      institution: 일리노이대학교 어바나-샴페인 (University of Illinois, Urbana-Champaign), 미국
      year: 2019
      description:
        - title: (박사논문) "We Will Remember You, forever!" Active Forgetting of Moo-hyun Roh in the Age of Mediatized Memories.
          contents:
            - 미디어화된 기억의 시대에 문화적 기억의 재생산과 변형을 탐구한 기억 연구. 정치적·미디어적 환경 속에서 자발적 망각과 선택적 기억의 수행을 분석했다.

    - title: 문화연구 석사
      institution: 골드스미스, 런던대학교 (Goldsmiths, University of London), 영국

    - title: 미디어와 커뮤니케이션 학사
      institution: 한국외국어대학교, 서울, 대한민국

- title: 경력
  type: time_table
  contents:
    - title: 조사팀장
      institution: 제주 4·3 평화재단
      year: 2022년 5월 – 현재
      description:
        - 제주 4·3 평화재단에서 역사적 인권 침해에 대한 심층 조사를 수행했다. 미국 국립문서보관소(NARA) 아카이브 연구, 피해자 증언 수집, 국가 책임·군경 잔혹성·강제 이주 등 핵심 사안에 대한 국가 후속 진상조사 연구를 진행했다. 피해자 유해 발굴 및 DNA 신원 확인 사업을 관리했으며, 정책 제안과 유네스코 세계기록유산 등재에 기여했다.

    - title: 연구원
      institution: 제주 4·3 평화재단
      year: 2019년 7월 – 2022년 5월
      description:
        - 미국 아카이브 소재 제주 4·3 관련 역사 문서의 수집 및 정리를 전담했다. 피해자 유해 발굴 및 신원 확인 사업을 관리했으며, 세 차례의 국제 심포지움을 기획·운영하는 실무 코디네이터 역할을 수행했다. 제주 4·3 역사 자료의 유네스코 세계기록유산 등재 신청서 작성의 실무를 담당했다.

- title: 학문적 관심 분야
  type: nested_list
  contents:
    - title: 미디어화된 기억
      items:
        - 대중 미디어를 통해 전(前)/재(再)매개되는 집단 기억; 사회적 기억
    - title: 인권 침해 연구
      items:
        - 유해 발굴 및 DNA 신원 확인; 아카이브 연구
